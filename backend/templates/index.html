<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss直聘智能岗位匹配系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-50 min-h-screen">
<!-- 头部 -->
<header class="glass border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <div class="w-10 h-10 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl mr-4 flex items-center justify-center">
                    <span class="text-white font-bold text-lg">🤖</span>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Boss直聘智能助手</h1>
                    <p class="text-sm text-gray-600">AI驱动的岗位搜索与匹配系统</p>
                </div>
            </div>
            <div class="flex items-center">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-red-500 mr-2"></div>
                <span id="status-text" class="text-xs text-gray-500">未连接</span>
            </div>
        </div>
    </div>
</header>

<!-- 主内容 -->
<main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- 左侧：简历上传和搜索配置 -->
        <div class="lg:col-span-1 space-y-6">
            <!-- 简历上传卡片 -->
            <div class="card">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">📄 简历信息</h3>
                
                <!-- 简历上传区域 -->
                <div id="upload-section">
                    <div id="upload-area" class="upload-area p-4 rounded-xl text-center border-2 border-dashed border-gray-200">
                        <div class="mb-2">
                            <div class="w-12 h-12 bg-blue-100 rounded-full mx-auto mb-2 flex items-center justify-center">
                                <span class="text-xl">📤</span>
                            </div>
                            <p class="text-sm text-gray-600 mb-2">上传简历优化匹配</p>
                        </div>
                        
                        <div class="space-y-2">
                            <input type="file" id="resume-file-input" accept=".pdf,.docx,.txt" class="hidden">
                            <button onclick="document.getElementById('resume-file-input').click()" class="btn btn-primary btn-sm">
                                选择文件
                            </button>
                            <p class="text-xs text-gray-500">支持 PDF、DOCX、TXT</p>
                        </div>
                    </div>
                    
                    <!-- 上传进度 -->
                    <div id="upload-progress" class="mt-3" style="display: none;">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-sm font-medium text-gray-700">处理中...</span>
                            <span id="upload-percentage" class="text-sm text-gray-500">0%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div id="upload-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 简历状态显示 -->
                <div id="resume-status" class="mt-4 pt-4 border-t border-gray-100">
                    <div class="text-center py-2">
                        <p class="text-sm text-gray-600">未上传简历</p>
                        <p class="text-xs text-gray-500">上传后获得更精准匹配</p>
                    </div>
                </div>
            </div>
            
            <!-- 搜索配置 -->
            <div class="card">
                <h2 class="text-xl font-semibold text-gray-900 mb-6">🔍 搜索配置</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">搜索关键词</label>
                            <input type="text" id="keyword" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="如：市场风险管理、数据分析、AI工程师" value="">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">🌍 目标城市</label>
                            <select id="city" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">请选择城市</option>
                                <option value="shanghai">上海</option>
                                <option value="beijing">北京</option>
                                <option value="shenzhen">深圳</option>
                                <option value="hangzhou">杭州</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">搜索数量</label>
                            <input type="number" id="max_jobs" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="80" min="1" max="100">
                            <p class="text-xs text-gray-500 mt-1">系统将自动分析所有搜索到的岗位</p>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">🤖 AI 服务商</label>
                            <select id="ai-provider" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="deepseek">DeepSeek</option>
                                <option value="claude">Claude</option>
                                <option value="gpt">GPT</option>
                                <option value="gemini">Gemini</option>
                                <option value="glm">GLM (智谱AI)</option>
                            </select>
                            <p class="text-xs text-gray-500 mt-1">选择用于分析岗位的AI模型</p>
                        </div>

                        <button id="start-search-btn" class="btn btn-primary w-full">
                            开始搜索
                        </button>
                    </div>
                </div>

                <!-- 进度卡片 -->
                <div class="card">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">⏱️ 任务进度</h3>
                    <div id="progress-container">
                        <!-- 主进度条 -->
                        <div id="progress-bar" class="w-full h-3 bg-gray-200 rounded-full mb-4" style="display: none;">
                            <div id="progress-fill" class="h-full bg-gradient-to-r from-blue-500 to-purple-600 rounded-full transition-all duration-500 relative" style="width: 0%">
                                <div class="absolute inset-0 bg-white/20 rounded-full animate-pulse"></div>
                            </div>
                        </div>
                        
                        <!-- 进度百分比 -->
                        <div id="progress-percentage" class="text-right text-xs text-gray-500 mb-2" style="display: none;">0%</div>
                        
                        <!-- 当前状态 -->
                        <div id="progress-message" class="text-sm font-medium text-gray-800 mb-3 p-2 bg-gray-50 rounded-lg">
                            等待开始搜索...
                        </div>
                        
                        <!-- 阶段指示器 -->
                        <div id="stage-indicators" class="grid grid-cols-4 gap-2 mb-4" style="display: none;">
                            <div class="stage-item" data-stage="search">
                                <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold mx-auto mb-1">1</div>
                                <div class="text-xs text-center text-gray-500">搜索岗位</div>
                            </div>
                            <div class="stage-item" data-stage="extract">
                                <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold mx-auto mb-1">2</div>
                                <div class="text-xs text-center text-gray-500">AI分析</div>
                            </div>
                            <div class="stage-item" data-stage="analysis">
                                <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold mx-auto mb-1">3</div>
                                <div class="text-xs text-center text-gray-500">整理结果</div>
                            </div>
                            <div class="stage-item" data-stage="complete">
                                <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold mx-auto mb-1">4</div>
                                <div class="text-xs text-center text-gray-500">完成</div>
                            </div>
                        </div>
                        
                        <!-- 详细日志 -->
                        <div class="border-t pt-3">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-medium text-gray-700">详细日志</span>
                                <button id="toggle-logs" class="text-xs text-blue-600 hover:text-blue-800" onclick="toggleProgressLogs()">展开</button>
                            </div>
                            <div id="progress-logs" class="max-h-32 overflow-y-auto space-y-1 text-xs" style="display: none;"></div>
                        </div>
                    </div>
                </div>
            </div>

        <!-- 右侧：结果展示 -->
        <div class="lg:col-span-2">
            <div id="results-container" class="space-y-6">
                <!-- 统计信息 -->
                <div id="stats-card" class="card" style="display: none;">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">搜索结果统计</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="text-center cursor-pointer hover:bg-gray-50 rounded-lg p-3 transition-colors" onclick="showAllJobs()">
                            <div id="total-jobs" class="text-2xl font-bold text-blue-600">0</div>
                            <div class="text-sm text-gray-600">总搜索数</div>
                            <div class="text-xs text-gray-400 mt-1">点击查看所有</div>
                        </div>
                        <div class="text-center cursor-pointer hover:bg-gray-50 rounded-lg p-3 transition-colors" onclick="showQualifiedJobs()">
                            <div id="qualified-jobs" class="text-2xl font-bold text-purple-600">0</div>
                            <div class="text-sm text-gray-600">推荐岗位</div>
                            <div class="text-xs text-gray-400 mt-1">点击查看推荐</div>
                        </div>
                    </div>
                </div>

                <!-- 岗位列表 -->
                <div id="jobs-list"></div>
                
                <!-- 空状态 -->
                <div id="empty-state" class="card text-center py-12">
                    <div class="w-16 h-16 bg-gray-100 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <span class="text-2xl">🔍</span>
                    </div>
                    <h3 class="text-lg font-medium text-gray-900 mb-2">开始搜索岗位</h3>
                    <p class="text-gray-600 mb-6">配置搜索参数并点击"开始搜索"来查找合适的岗位</p>
                    <p class="text-sm text-gray-500">上传简历后可获得更精准的匹配分析</p>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- JavaScript -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
