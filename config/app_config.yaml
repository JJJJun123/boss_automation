# Boss直聘自动化应用配置文件
# 此文件包含应用的基础设置，可以提交到版本控制系统

# 应用基础信息
app:
  name: "Boss直聘AI助手"
  version: "1.0.0"
  description: "智能化的Boss直聘岗位筛选工具"

# AI模型配置
ai:
  # 支持的AI服务商列表
  supported_providers:
    - claude
    - gpt
    - glm
    - deepseek

  # 默认AI服务商
  default_provider: "claude"

  # 各 AI 模型的默认配置（截至 2026-05 的最新版本）
  models:
    claude:
      # 简历×JD 匹配主力。Sonnet 4.6 性价比平衡（$3/$15 每百万 token）
      model_name: "claude-sonnet-4-6"
      temperature: 0.3
      max_tokens: 1000
      available_models:
        - "claude-opus-4-7" # 旗舰，最强（$5/$25），复杂匹配场景
        - "claude-sonnet-4-6" # 平衡（默认）
        - "claude-haiku-4-5-20251001" # 最快最便宜（$1/$5）
    gpt:
      # GPT-5.5（2026-04-23 发布）；可备用 chat-latest 别名指向最新默认模型
      model_name: "gpt-5.5-2026-04-23"
      temperature: 0.3
      max_tokens: 1000
      available_models:
        - "gpt-5.5-2026-04-23"
        - "chat-latest" # 别名，永远指向 ChatGPT 当前默认（目前 = GPT-5.5 Instant）
        - "gpt-5.4-mini" # 经济档
    glm:
      # 第一阶段廉价筛选。GLM-4.7-Flash 是免费 30B 模型（SOTA 同量级）
      model_name: "glm-4.7-flash"
      temperature: 0.3
      max_tokens: 2000
      available_models:
        - "glm-5.1" # 旗舰（2026-04-07，对标 Claude Opus 4.6）
        - "glm-4.7" # 355B 稀疏激活，开源
        - "glm-4.7-flash" # 免费快速（默认筛选用）
    deepseek:
      # ⚠️ 2026-07-24 起 deepseek-reasoner / deepseek-chat 将弃用，已切到 V4 系列
      model_name: "deepseek-v4-pro"
      temperature: 0.3
      max_tokens: 1000
      available_models:
        - "deepseek-v4-pro" # 旗舰
        - "deepseek-v4-flash" # 经济档

# 爬虫配置
crawler:
  # Boss直聘基础URL
  base_url: "https://www.zhipin.com"

  # 浏览器配置
  browser:
    headless: false # 是否无头模式
    timeout: 30 # 页面加载超时时间(秒)
    diagnostic_logging: false # 诊断日志开关（页面跳转/调试截图），默认关闭
    channel: "chrome" # 优先使用本机Chrome，失败自动回退到Playwright Chromium
    # Chrome用户数据目录（用于保持登录状态）
    user_data_dir: "~/Library/Application Support/boss_automation/browser_profile/boss_zhipin" # 用户目录存储浏览器配置
    use_persistent_context: false # Boss站点在persistent_context下会自动跳about:blank，默认关闭

  # 反爬虫设置
  anti_detection:
    random_delay_min: 1 # 最小延迟(秒)
    random_delay_max: 3 # 最大延迟(秒)
    scroll_times: 3 # 滚动次数

  # 数据提取设置
  extraction:
    max_retries: 3 # 最大重试次数
    retry_delay: 2 # 重试延迟(秒)

# 系统限制
limits:
  max_jobs_search: 100 # 最大搜索岗位数
  max_jobs_analyze: 80 # 最大分析岗位数（提升以支持大规模分析）
  min_score: 6 # 最小评分（6分以上才是合格岗位）
  max_score: 10 # 最大评分

# 城市配置
cities:
  shanghai:
    name: "上海"
    code: "101020100"
  hangzhou:
    name: "杭州"
    code: "101210100"
  shenzhen:
    name: "深圳"
    code: "101280600"
  beijing:
    name: "北京"
    code: "101010100"

# 日志配置
logging:
  level: "WARNING"
  file: "logs/app.log"
  max_size: "10MB"
  backup_count: 5

# Web界面配置
web:
  host: "127.0.0.1"
  port: 3001 # macOS 26 上 5000 被 AirPlay 接收器占用，避开
  debug: true

  # 静态资源配置
  static_folder: "../frontend/build"
  template_folder: "../frontend/build"
