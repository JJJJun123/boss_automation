ai_analysis:
  analysis_depth: standard
  min_score: 6
  provider: glm
export:
  default_format: json
  include_fields:
  - title
  - company
  - salary
  - score
  - analysis
  - url
  - job_description
history:
  auto_cleanup_low_score: true
  cleanup_threshold: 4
  retention_days: 30
  save_search_history: true
search:
  fetch_details: true
  keyword: 市场风险管理
  max_analyze_jobs: 50
  max_jobs: 5
  quick_keywords:
  - 市场风险管理
  - 风险控制
  - 量化分析
  - 金融风控
  - 投资顾问
  - 战略咨询
  - 管理咨询
  - AI算法
  - 机器学习
  - 数据分析
  selected_cities:
  - shanghai
  - hangzhou
ui_preferences:
  language: zh-CN
  notifications:
    show_completion: true
    show_progress: true
    sound_enabled: false
  results_display:
    auto_refresh: false
    items_per_page: 10
    show_company_info: true
    show_detailed_analysis: true
  theme: auto
